name: Smoke-test anonymous verification
run-name: verify ${{ inputs.candidate_id }}

on:
  workflow_dispatch:
    inputs:
      candidate_id:
        description: Public candidate release tag to reproduce
        required: true
        type: string
      manifest_sha256:
        description: Reviewed SHA-256 of candidate.json
        required: true
        type: string
      android_only:
        description: Run Android device qualification without repeating native reproduction
        required: false
        default: false
        type: boolean

permissions: {}

jobs:
  inputs:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - name: Validate candidate identity and smoke-test scope
        env:
          CANDIDATE_ID: ${{ inputs.candidate_id }}
          MANIFEST_SHA256: ${{ inputs.manifest_sha256 }}
        shell: bash
        run: |
          test "$GITHUB_REPOSITORY" = tnull/ldk-node-bindings-test
          jq -e '.repository.private == false' "$GITHUB_EVENT_PATH"
          [[ "$CANDIDATE_ID" =~ ^candidate-[A-Za-z0-9._-]+$ ]]
          [[ "$MANIFEST_SHA256" =~ ^[0-9a-f]{64}$ ]]
          [[ "$GITHUB_SHA" =~ ^[0-9a-f]{40}$ ]]

  verify:
    needs: inputs
    if: ${{ ! inputs.android_only }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - group: generated
            runner: ubuntu-24.04
            arch: x86_64
          - group: linux-x86_64
            runner: ubuntu-24.04
            arch: x86_64
          - group: linux-aarch64
            runner: ubuntu-24.04-arm
            arch: aarch64
          - group: android
            runner: ubuntu-24.04
            arch: x86_64
          - group: darwin
            runner: xcode-27
            arch: arm64
          - group: jvm
            runner: ubuntu-24.04
            arch: x86_64
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 180
    steps:
      - name: Fetch the exact workflow revision anonymously
        shell: bash
        run: |
          unset GH_TOKEN GITHUB_TOKEN
          export GIT_CONFIG_NOSYSTEM=1 GIT_CONFIG_GLOBAL=/dev/null
          export GIT_TERMINAL_PROMPT=0
          git init --quiet --template=
          git -c credential.helper= -c core.askPass= fetch --quiet --depth=1 \
            "https://github.com/$GITHUB_REPOSITORY.git" "$GITHUB_SHA"
          git checkout --quiet --detach FETCH_HEAD
          test "$(git rev-parse HEAD)" = "$GITHUB_SHA"
      - name: Check host architecture
        env:
          EXPECTED_ARCH: ${{ matrix.arch }}
        shell: bash
        run: test "$(uname -m)" = "$EXPECTED_ARCH"
      - name: Select pinned Apple tools
        if: matrix.group == 'darwin'
        shell: bash
        run: |
          sudo xcode-select --switch /Applications/Xcode_27.0.app/Contents/Developer
          test "$(xcodebuild -version)" = $'Xcode 27.0\nBuild version 27A266a'
      - uses: cachix/install-nix-action@13d8dd58da0234aa297dedd986986ccb8e7f3e24 # v31
        with:
          install_url: https://releases.nixos.org/nix/nix-2.35.2/install
          extra_nix_config: |
            experimental-features = nix-command flakes
            accept-flake-config = false
            always-allow-substitutes = false
            access-tokens =
      - name: Check anonymous Nix bootstrap
        shell: bash
        run: |
          test "$(nix --version)" = 'nix (Nix) 2.35.2'
          # The final blank setting applies before the installer starts the daemon.
          nix config show --json | jq -e '.["access-tokens"].value == {}' >/dev/null
          # Remove the install action's overridden token from the file as well.
          awk '!/^[[:space:]]*(extra-)?access-tokens[[:space:]]*=/;
            END { print "access-tokens =" }' /etc/nix/nix.conf \
            > "$RUNNER_TEMP/anonymous-nix.conf"
          sudo install -m 644 "$RUNNER_TEMP/anonymous-nix.conf" /etc/nix/nix.conf
          nix config show --json | jq -e '.["access-tokens"].value == {}' >/dev/null
      - name: Reproduce the public candidate anonymously
        env:
          CANDIDATE_ID: ${{ inputs.candidate_id }}
          MANIFEST_SHA256: ${{ inputs.manifest_sha256 }}
          BUILD_GROUP: ${{ matrix.group }}
        shell: bash
        run: |
          mkdir -p "$RUNNER_TEMP/verification-evidence"
          env -u GH_TOKEN -u GITHUB_TOKEN scripts/verify.sh \
            "$CANDIDATE_ID" "$MANIFEST_SHA256" --repo "$GITHUB_REPOSITORY" \
            --group "$BUILD_GROUP" --output "$RUNNER_TEMP/verification" \
            2>&1 | tee "$RUNNER_TEMP/verification-evidence/verify.log"
      - name: Preserve receipts and focused diagnostics
        if: always()
        env:
          BUILD_GROUP: ${{ matrix.group }}
        shell: bash
        run: |
          result="$RUNNER_TEMP/verification"
          evidence="$RUNNER_TEMP/verification-evidence"
          mkdir -p "$evidence"
          {
            printf 'Workflow revision: %s\nGroup: %s\n' "$GITHUB_SHA" "$BUILD_GROUP"
            uname -a
            df -h
          } > "$evidence/host.txt"
          for directory in receipts diagnostics; do
            if [[ -d "$result/$directory" ]]; then
              cp -R "$result/$directory" "$evidence/"
            fi
          done
          for file in "$result/candidate/candidate.json" \
            "$result/candidate/checksums.txt" "$result/candidate/"*.inventory.json; do
            if [[ -f "$file" ]]; then cp "$file" "$evidence/"; fi
          done
          failure="$result/diagnostics/$BUILD_GROUP/failure.json"
          if [[ -f "$failure" ]]; then
            work_dir=$(jq -er '.work_dir' "$failure")
            [[ "$work_dir" =~ ^/tmp/bindings-verify-[A-Za-z0-9]+$ ]]
            if [[ -d "$work_dir/output" ]]; then
              find "$work_dir/output" -type f -exec shasum -a 256 {} + \
                > "$evidence/diagnostics/$BUILD_GROUP/rebuilt-sha256.txt"
              cp -R "$work_dir/output" "$evidence/diagnostics/$BUILD_GROUP/rebuilt"
            fi
            for log in "$work_dir"/native-build-*/generation.log; do
              if [[ -f "$log" ]]; then
                cp "$log" "$evidence/diagnostics/$BUILD_GROUP/"
              fi
            done
          fi
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: always()
        with:
          name: verify-${{ matrix.group }}
          path: ${{ runner.temp }}/verification-evidence/
          if-no-files-found: error
          retention-days: 7

  android-runtime:
    needs: inputs
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    strategy:
      fail-fast: false
      matrix:
        include:
          - api: 21
            image: google_apis
            revision: 32
            page_size: 4096
          - api: 22
            image: google_apis
            revision: 26
            page_size: 4096
          - api: 23
            image: google_apis
            revision: 33
            page_size: 4096
          - api: 35
            image: google_apis_ps16k
            revision: 5
            page_size: 16384
    steps:
      - name: Fetch the exact test revision anonymously
        shell: bash
        run: |
          unset GH_TOKEN GITHUB_TOKEN
          export GIT_CONFIG_NOSYSTEM=1 GIT_CONFIG_GLOBAL=/dev/null
          export GIT_TERMINAL_PROMPT=0
          git init --quiet --template=
          git -c credential.helper= -c core.askPass= fetch --quiet --depth=1 \
            "https://github.com/$GITHUB_REPOSITORY.git" "$GITHUB_SHA"
          git checkout --quiet --detach FETCH_HEAD
          test "$(git rev-parse HEAD)" = "$GITHUB_SHA"
      - name: Select consumer tools and enable KVM
        shell: bash
        run: |
          sudo apt-get update
          sudo apt-get install --yes --no-install-recommends libpulse0
          test -c /dev/kvm
          sudo chmod a+rw /dev/kvm
          echo "JAVA_HOME=$JAVA_HOME_17_X64" >> "$GITHUB_ENV"
          printf '%s\n' "$JAVA_HOME_17_X64/bin" "$ANDROID_HOME/cmdline-tools/latest/bin" \
            "$ANDROID_HOME/platform-tools" >> "$GITHUB_PATH"
          curl --fail --location https://downloads.gradle.org/distributions/gradle-7.6-bin.zip \
            --output "$RUNNER_TEMP/gradle.zip"
          printf '7ba68c54029790ab444b39d7e293d3236b2632631fb5f2e012bb28b4ff669e4b  %s\n' \
            "$RUNNER_TEMP/gradle.zip" | sha256sum --check --strict
          unzip -q "$RUNNER_TEMP/gradle.zip" -d "$RUNNER_TEMP"
          echo "$RUNNER_TEMP/gradle-7.6/bin" >> "$GITHUB_PATH"
          echo "ANDROID_RUNTIME_EVIDENCE=$RUNNER_TEMP/android-runtime" >> "$GITHUB_ENV"
      - name: Download and authenticate the actual candidate Android publication
        env:
          CANDIDATE_ID: ${{ inputs.candidate_id }}
          MANIFEST_SHA256: ${{ inputs.manifest_sha256 }}
        shell: bash
        run: |
          bash smoke/android-runtime/prepare.sh "$CANDIDATE_ID" "$MANIFEST_SHA256" \
            "$RUNNER_TEMP/android-runtime"
      - name: Build the minified consumer
        shell: bash
        run: |
          bash smoke/android-runtime/check-results-test.sh
          bash smoke/android-runtime/check-emulator-test.sh
          sdkmanager --install 'platforms;android-34' 'build-tools;34.0.0'
          gradle -p smoke/android-runtime --no-daemon --no-build-cache \
            :app:assembleRelease :instrumentation:assembleRelease \
            2>&1 | tee "$ANDROID_RUNTIME_EVIDENCE/assemble.log"
          bash smoke/android-runtime/check-apk.sh
      - name: Run native calls and callbacks on the emulator
        env:
          ANDROID_API: ${{ matrix.api }}
          ANDROID_IMAGE: ${{ matrix.image }}
          ANDROID_IMAGE_REVISION: ${{ matrix.revision }}
          ANDROID_PAGE_SIZE: ${{ matrix.page_size }}
        shell: bash
        run: |
          bash smoke/android-runtime/emulator.sh "$ANDROID_API" "$ANDROID_IMAGE" \
            "$ANDROID_IMAGE_REVISION" "$ANDROID_PAGE_SIZE"
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: always()
        with:
          name: android-runtime-api-${{ matrix.api }}
          path: |
            ${{ runner.temp }}/android-runtime/
            smoke/android-runtime/app/build/outputs/mapping/release/
            smoke/android-runtime/app/build/outputs/apk/
            smoke/android-runtime/instrumentation/build/outputs/androidTest-results/
            smoke/android-runtime/instrumentation/build/outputs/apk/
            smoke/android-runtime/instrumentation/build/outputs/mapping/release/
            smoke/android-runtime/instrumentation/build/reports/androidTests/
          if-no-files-found: error
          retention-days: 7
